name: CI

# 2026-05-13 新設（ハーネスエンジニアリング監査の指摘対応）。
# pre-commit hook はローカルのみで `--no-verify` バイパスや別端末（Win）から push
# された場合に素通りするため、CI でも同じ検査を走らせる多層防御。
#
# 走らせる検査：
#  build job:
#   1. functions/ の TypeScript ビルド（tsc）
#   2. functions/ の jest ユニットテスト
#   3. scripts/verify_pricing.js（料金表 SSOT 照合）
#   4. HTML inline script の構文チェック
#   5. merge conflict マーカー / credential leak / SHEET_HEADERS タグ強制
#  integration job（2026-05-13 追加）:
#   6. Firestore Emulator 起動 + tests/integration/ 配下を実行
#      （emulator は Java 必要・firebase-tools 経由で起動）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SHEET_HEADERS 変更検出のため履歴を全部 fetch（shallow だと git diff HEAD~1 が動かない）
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: TypeScript build
        working-directory: functions
        run: npm run build

      - name: Run jest unit tests
        working-directory: functions
        run: npm test
        # integration tests are in the separate `integration` job below
        # (Firestore Emulator + Java requirement makes them too heavy for the build job).

      - name: Verify pricing SSOT
        run: node scripts/verify_pricing.js

      - name: HTML inline script syntax check
        run: |
          node -e "
            const fs = require('fs');
            const files = ['index.html', 'staff.html', 'staff2.html', 'staff_tennis.html'];
            let errors = 0;
            files.forEach(f => {
              const html = fs.readFileSync(f, 'utf8');
              const re = /<script(?![^>]*\bsrc=)(?![^>]*\btype=\"module\")[^>]*>([\s\S]*?)<\/script>/g;
              let m, i = 0;
              while ((m = re.exec(html)) !== null) {
                i++;
                try { new Function(m[1]); }
                catch (e) { console.error(f + ' script #' + i + ': ' + e.message); errors++; }
              }
            });
            if (errors > 0) { console.error('Total errors: ' + errors); process.exit(1); }
            console.log('All HTML inline scripts: syntax OK');
          "

      - name: Check for merge conflict markers
        run: |
          if grep -rnE '^(<{7}|={7}|>{7})( |$)' \
              --include='*.html' --include='*.ts' --include='*.js' --include='*.md' \
              --exclude-dir=node_modules --exclude-dir=lib .; then
            echo "❌ Merge conflict markers found"
            exit 1
          fi
          echo "✅ No merge conflict markers"

      - name: Credential leak scan
        # pre-commit hook §4 と同等のチェック。--no-verify バイパス対策。
        # Firebase apiKey（クライアント公開OK）は除外リストで誤検知防止。
        run: |
          set +e
          MATCHES=$(grep -rnE \
            -e "'[a-f0-9]{64}'" \
            -e "sk-[A-Za-z0-9_-]{40,}" \
            -e "sk_live_[A-Za-z0-9]{20,}" \
            -e "rk_live_[A-Za-z0-9]{20,}" \
            -e "ghp_[A-Za-z0-9]{30,}" \
            -e "github_pat_[A-Za-z0-9_]{50,}" \
            -e "sk-ant-[A-Za-z0-9_-]{50,}" \
            -e "Bearer [A-Za-z0-9_.-]{40,}" \
            --include='*.html' --include='*.js' --include='*.ts' \
            --include='*.md' --include='*.py' --include='*.sh' \
            --include='*.json' --include='*.yaml' --include='*.yml' \
            --exclude-dir=node_modules --exclude-dir=lib --exclude-dir=.git . \
            2>/dev/null \
            | grep -v "AIzaSyDS4b-ukVqd1iiMo7DeRIB2tzKwrt-or10")
          if [ -n "$MATCHES" ]; then
            echo "❌ Possible credential leak detected:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No credential leak patterns detected"

      - name: SHEET_HEADERS change requires [sheet-schema] commit tag
        # pre-commit hook §5 と同等。SHEET_HEADERS/SYNC_CLEAR_RANGE/SHEET_LAST_COLUMN を
        # 変更しているのに **対象範囲内のいずれかの commit** に [sheet-schema] タグがない場合は fail。
        # 2026-05-13: 「複数 commit を一度に push して中間 commit の違反が素通り」する穴を
        # 塞ぐため、各 commit 個別にタグ存在を確認する形に変更。
        run: |
          set +e
          # PR は base..HEAD、push は event.before..HEAD を対象（複数 commit に対応）
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="HEAD~1"
          fi
          SCHEMA_FILES="functions/src/lib/sheets.ts functions/src/services/sheetsSync.ts functions/src/index.ts functions/src/constants.ts"
          # 範囲内の各 commit をループし、schema 変更が含まれる commit に [sheet-schema] があるか個別判定
          COMMITS=$(git rev-list "$BASE_SHA..HEAD" 2>/dev/null)
          FAIL_COMMITS=""
          for commit in $COMMITS; do
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$commit" 2>/dev/null)
            HIT=0
            for f in $SCHEMA_FILES; do
              if echo "$CHANGED" | grep -qE "(^|/)$(basename $f)\$"; then
                if git show "$commit" -- "$f" 2>/dev/null | grep -qE "^[+-].*(SHEET_HEADERS|SYNC_CLEAR_RANGE|SHEET_LAST_COLUMN)"; then
                  HIT=1
                  break
                fi
              fi
            done
            if [ "$HIT" -eq 1 ]; then
              MSG=$(git log -1 --pretty=%B "$commit")
              if ! echo "$MSG" | grep -q "\[sheet-schema\]"; then
                FAIL_COMMITS="$FAIL_COMMITS $commit"
              fi
            fi
          done
          if [ -n "$FAIL_COMMITS" ]; then
            echo "❌ SHEET_HEADERS/SYNC_CLEAR_RANGE/SHEET_LAST_COLUMN を変更しているのに [sheet-schema] タグがない commit:"
            for c in $FAIL_COMMITS; do
              echo "   $(git log -1 --oneline $c)"
            done
            echo "   詳細: 00_projects/futami_reservation/CLAUDE.md ★5 ルール"
            exit 1
          fi
          echo "✅ [sheet-schema] タグ確認OK（複数 commit 対応）"

  integration:
    name: Integration Tests (Firestore Emulator)
    runs-on: ubuntu-latest
    # build job が通ってから走らせる（順序依存）
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java 21 (required by firebase-tools / Firestore Emulator)
        # 2026-05-13: firebase-tools v15+ は Java 21 必須。17 だと「no longer supports
        # Java version before 21」で fail する。ローカルは openjdk 25 を使用中。
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase Emulator JAR
        # JAR 初回ダウンロードで 30-60 秒。キャッシュで2回目以降を高速化。
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Run integration tests via Firestore Emulator
        working-directory: functions
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          firebase emulators:exec \
            --only firestore \
            --project futami-yoyaku-492607 \
            "npm run test:integration"
