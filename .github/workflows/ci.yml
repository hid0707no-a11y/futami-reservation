name: CI

# 2026-05-13 新設（ハーネスエンジニアリング監査の指摘対応）。
# pre-commit hook はローカルのみで `--no-verify` バイパスや別端末（Win）から push
# された場合に素通りするため、CI でも同じ検査を走らせる多層防御。
#
# 走らせる検査：
#  build job:
#   1. functions/ の TypeScript ビルド（tsc）
#   2. functions/ の jest ユニットテスト
#   3. scripts/verify_pricing.js（料金表 SSOT 照合）
#   4. HTML inline script の構文チェック
#   5. merge conflict マーカー / credential leak / SHEET_HEADERS タグ強制
#  integration job（2026-05-13 追加）:
#   6. Firestore Emulator 起動 + tests/integration/ 配下を実行
#      （emulator は Java 必要・firebase-tools 経由で起動）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SHEET_HEADERS 変更検出のため履歴を全部 fetch（shallow だと git diff HEAD~1 が動かない）
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: TypeScript build
        working-directory: functions
        run: npm run build

      - name: Run jest unit tests
        working-directory: functions
        run: npm test
        # integration tests are in the separate `integration` job below
        # (Firestore Emulator + Java requirement makes them too heavy for the build job).

      - name: Verify pricing SSOT
        run: node scripts/verify_pricing.js

      - name: HTML inline script syntax check
        run: |
          node -e "
            const fs = require('fs');
            const files = ['index.html', 'staff.html', 'staff2.html', 'staff_tennis.html'];
            let errors = 0;
            files.forEach(f => {
              const html = fs.readFileSync(f, 'utf8');
              const re = /<script(?![^>]*\bsrc=)(?![^>]*\btype=\"module\")[^>]*>([\s\S]*?)<\/script>/g;
              let m, i = 0;
              while ((m = re.exec(html)) !== null) {
                i++;
                try { new Function('\"use strict\";\n' + m[1]); }
                catch (e) { console.error(f + ' script #' + i + ': ' + e.message); errors++; }
              }
            });
            if (errors > 0) { console.error('Total errors: ' + errors); process.exit(1); }
            console.log('All HTML inline scripts: syntax OK');
          "

      - name: Check for merge conflict markers
        run: |
          if grep -rnE '^(<{7}|={7}|>{7})( |$)' \
              --include='*.html' --include='*.ts' --include='*.js' --include='*.md' \
              --exclude-dir=node_modules --exclude-dir=lib .; then
            echo "❌ Merge conflict markers found"
            exit 1
          fi
          echo "✅ No merge conflict markers"

      - name: Credential leak scan
        # pre-commit hook §4 と同等のチェック。--no-verify バイパス対策。
        # Firebase apiKey（クライアント公開OK）は除外リストで誤検知防止。
        run: |
          set +e
          MATCHES=$(grep -rnE \
            -e "'[a-f0-9]{64}'" \
            -e "sk-[A-Za-z0-9_-]{40,}" \
            -e "sk_live_[A-Za-z0-9]{20,}" \
            -e "rk_live_[A-Za-z0-9]{20,}" \
            -e "ghp_[A-Za-z0-9]{30,}" \
            -e "github_pat_[A-Za-z0-9_]{50,}" \
            -e "sk-ant-[A-Za-z0-9_-]{50,}" \
            -e "Bearer [A-Za-z0-9_.-]{40,}" \
            --include='*.html' --include='*.js' --include='*.ts' \
            --include='*.md' --include='*.py' --include='*.sh' \
            --include='*.json' --include='*.yaml' --include='*.yml' \
            --exclude-dir=node_modules --exclude-dir=lib --exclude-dir=.git . \
            2>/dev/null \
            | grep -v "AIzaSyDS4b-ukVqd1iiMo7DeRIB2tzKwrt-or10")
          if [ -n "$MATCHES" ]; then
            echo "❌ Possible credential leak detected:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No credential leak patterns detected"

      - name: PII scan (email / phone)
        # pre-commit hook §4b と同等。こちらは差分でなく **ツリー全体** を見る。
        # 経緯（2026-09-02）: data.json に Google カレンダー由来の実顧客の氏名・電話・メールが
        # 入ったまま commit され、public リポ＋GitHub Pages 直下配信で 148 日間公開されていた。
        # 上の credential scan は資格情報8パターンしか見ておらず素通りした。
        # 許可リスト = hooks/pii_allowlist.txt（コメント行と空行は必ず落とす。空行を -f に
        # 渡すと全行に一致して「合致ゼロ」と誤判定する）。
        # ★走査対象は git 追跡ファイルのみ（git ls-files）。
        #   grep -r . だと node_modules の長い数字列が 11 桁の携帯番号として誤検知され、
        #   それを許可リストに足すと本物の番号まで素通りする穴になる（2026-09-02 に実際に踏んだ）。
        #   未追跡・.gitignore 済みのファイルは公開されないので走査しない。
        run: |
          set +e
          ALLOW=hooks/pii_allowlist.txt
          grep -vE '^[[:space:]]*(#|$)' "$ALLOW" > /tmp/pii_allow.txt
          FILES=$(git ls-files | grep -v 'package-lock.json' | grep -v 'hooks/pii_allowlist.txt')
          HITS=$(grep -ohE \
            -e '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
            -e '0[0-9]{1,4}-[0-9]{1,4}-[0-9]{4}' \
            -e '0[5789]0[0-9]{8}' \
            $FILES \
            2>/dev/null | sort -u | grep -vE -f /tmp/pii_allow.txt)
          if [ -n "$HITS" ]; then
            echo "❌ 個人情報らしき文字列（hooks/pii_allowlist.txt に無い）が見つかりました。"
            echo "   このリポジトリは public です。値はログに出しません。件数と所在のみ:"
            echo "$HITS" | wc -l | xargs echo "   件数:"
            for h in $HITS; do
              case "$h" in
                *@*) echo "   メール形式 @${h##*@} を含むファイル:" ;;
                *)   echo "   電話形式 $(echo "$h" | cut -c1-6)**** を含むファイル:" ;;
              esac
              grep -rl -F "$h" --exclude-dir=node_modules --exclude-dir=lib \
                --exclude-dir=.git --exclude=pii_allowlist.txt . 2>/dev/null | sed 's/^/     /'
            done
            echo "   → 実在の連絡先なら .env / Secret Manager へ。ダミーなら hooks/pii_allowlist.txt に"
            echo "      理由コメント付きで追加し、コミットに [pii-allow] を付けてください。"
            exit 1
          fi
          echo "✅ No PII patterns detected outside the allowlist"

      - name: SHEET_HEADERS change requires [sheet-schema] commit tag
        # pre-commit hook §5 と同等。SHEET_HEADERS/SYNC_CLEAR_RANGE/SHEET_LAST_COLUMN を
        # 変更しているのに **対象範囲内のいずれかの commit** に [sheet-schema] タグがない場合は fail。
        # 2026-05-13: 「複数 commit を一度に push して中間 commit の違反が素通り」する穴を
        # 塞ぐため、各 commit 個別にタグ存在を確認する形に変更。
        run: |
          set +e
          # PR は base..HEAD、push は event.before..HEAD を対象（複数 commit に対応）
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            # 新ブランチ push（before=0000）: HEAD~1 だと最終 commit しか見ないので origin/main の分岐点を起点にする
            BASE_SHA=$(git merge-base origin/main HEAD 2>/dev/null)
          fi
          # #37 fail-closed: force-push 等で before が消えた / 解決不能なら merge-base にフォールバックし、
          # それでも解決できなければ PASS せず fail する（旧実装は rev-list 失敗→空→誤 PASS の fail-open だった）
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA=$(git merge-base origin/main HEAD 2>/dev/null)
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "❌ [sheet-schema] base SHA を解決できませんでした（fail-closed）。手動で [sheet-schema] タグ有無を確認してください。"
            exit 1
          fi
          SCHEMA_FILES="functions/src/lib/sheets.ts functions/src/services/sheetsSync.ts functions/src/index.ts functions/src/constants.ts"
          # 範囲内の各 commit をループし、schema 変更が含まれる commit に [sheet-schema] があるか個別判定
          COMMITS=$(git rev-list "$BASE_SHA..HEAD" 2>/dev/null)
          if [ $? -ne 0 ]; then
            echo "❌ [sheet-schema] git rev-list 失敗（fail-closed）: $BASE_SHA..HEAD"
            exit 1
          fi
          FAIL_COMMITS=""
          for commit in $COMMITS; do
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$commit" 2>/dev/null)
            HIT=0
            for f in $SCHEMA_FILES; do
              if echo "$CHANGED" | grep -qE "(^|/)$(basename $f)\$"; then
                if git show "$commit" -- "$f" 2>/dev/null | grep -qE "^[+-].*(SHEET_HEADERS|SYNC_CLEAR_RANGE|SHEET_LAST_COLUMN)"; then
                  HIT=1
                  break
                fi
              fi
            done
            if [ "$HIT" -eq 1 ]; then
              MSG=$(git log -1 --pretty=%B "$commit")
              if ! echo "$MSG" | grep -q "\[sheet-schema\]"; then
                FAIL_COMMITS="$FAIL_COMMITS $commit"
              fi
            fi
          done
          if [ -n "$FAIL_COMMITS" ]; then
            echo "❌ SHEET_HEADERS/SYNC_CLEAR_RANGE/SHEET_LAST_COLUMN を変更しているのに [sheet-schema] タグがない commit:"
            for c in $FAIL_COMMITS; do
              echo "   $(git log -1 --oneline $c)"
            done
            echo "   詳細: 00_projects/futami_reservation/CLAUDE.md ★5 ルール"
            exit 1
          fi
          echo "✅ [sheet-schema] タグ確認OK（複数 commit 対応）"

  integration:
    name: Integration Tests (Firestore Emulator)
    runs-on: ubuntu-latest
    # build job が通ってから走らせる（順序依存）
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java 21 (required by firebase-tools / Firestore Emulator)
        # 2026-05-13: firebase-tools v15+ は Java 21 必須。17 だと「no longer supports
        # Java version before 21」で fail する。ローカルは openjdk 25 を使用中。
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase Emulator JAR
        # JAR 初回ダウンロードで 30-60 秒。キャッシュで2回目以降を高速化。
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install firebase-tools
        # #39 メジャー固定：未固定だと次メジャー(v16等)の Java 要件変更等でコード無変更のまま CI が突然 fail する。
        # v15 系は Java 21 必須（上の setup-java と整合）。更新は意図的な PR で行う。
        run: npm install -g firebase-tools@15

      - name: Run integration tests via Firestore Emulator
        working-directory: functions
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          firebase emulators:exec \
            --only firestore \
            --project futami-yoyaku-492607 \
            "npm run test:integration"
