name: CI

# 2026-05-13 新設（ハーネスエンジニアリング監査の指摘対応）。
# pre-commit hook はローカルのみで `--no-verify` バイパスや別端末（Win）から push
# された場合に素通りするため、CI でも同じ検査を走らせる多層防御。
#
# 走らせる検査：
#  1. functions/ の TypeScript ビルド（tsc）
#  2. functions/ の jest ユニットテスト（integration は emulator 必要のためスキップ）
#  3. scripts/verify_pricing.js（料金表 SSOT 照合）
#  4. HTML inline script の構文チェック（hooks/pre-commit と同等のロジック）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SHEET_HEADERS 変更検出のため履歴を全部 fetch（shallow だと git diff HEAD~1 が動かない）
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: TypeScript build
        working-directory: functions
        run: npm run build

      - name: Run jest unit tests
        working-directory: functions
        run: npm test
        # integration tests are skipped: they require Firestore Emulator (port 8080)
        # which is not provisioned in this CI step. Run locally with:
        #   npm run test:integration

      - name: Verify pricing SSOT
        run: node scripts/verify_pricing.js

      - name: HTML inline script syntax check
        run: |
          node -e "
            const fs = require('fs');
            const files = ['index.html', 'staff.html', 'staff2.html', 'staff_tennis.html'];
            let errors = 0;
            files.forEach(f => {
              const html = fs.readFileSync(f, 'utf8');
              const re = /<script(?![^>]*\bsrc=)(?![^>]*\btype=\"module\")[^>]*>([\s\S]*?)<\/script>/g;
              let m, i = 0;
              while ((m = re.exec(html)) !== null) {
                i++;
                try { new Function(m[1]); }
                catch (e) { console.error(f + ' script #' + i + ': ' + e.message); errors++; }
              }
            });
            if (errors > 0) { console.error('Total errors: ' + errors); process.exit(1); }
            console.log('All HTML inline scripts: syntax OK');
          "

      - name: Check for merge conflict markers
        run: |
          if grep -rnE '^(<{7}|={7}|>{7})( |$)' \
              --include='*.html' --include='*.ts' --include='*.js' --include='*.md' \
              --exclude-dir=node_modules --exclude-dir=lib .; then
            echo "❌ Merge conflict markers found"
            exit 1
          fi
          echo "✅ No merge conflict markers"

      - name: Credential leak scan
        # pre-commit hook §4 と同等のチェック。--no-verify バイパス対策。
        # Firebase apiKey（クライアント公開OK）は除外リストで誤検知防止。
        run: |
          set +e
          MATCHES=$(grep -rnE \
            -e "'[a-f0-9]{64}'" \
            -e "sk-[A-Za-z0-9_-]{40,}" \
            -e "sk_live_[A-Za-z0-9]{20,}" \
            -e "rk_live_[A-Za-z0-9]{20,}" \
            -e "ghp_[A-Za-z0-9]{30,}" \
            -e "github_pat_[A-Za-z0-9_]{50,}" \
            -e "sk-ant-[A-Za-z0-9_-]{50,}" \
            -e "Bearer [A-Za-z0-9_.-]{40,}" \
            --include='*.html' --include='*.js' --include='*.ts' \
            --include='*.md' --include='*.py' --include='*.sh' \
            --include='*.json' --include='*.yaml' --include='*.yml' \
            --exclude-dir=node_modules --exclude-dir=lib --exclude-dir=.git . \
            2>/dev/null \
            | grep -v "AIzaSyDS4b-ukVqd1iiMo7DeRIB2tzKwrt-or10")
          if [ -n "$MATCHES" ]; then
            echo "❌ Possible credential leak detected:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No credential leak patterns detected"

      - name: SHEET_HEADERS change requires [sheet-schema] commit tag
        # pre-commit hook §5 と同等。SHEET_HEADERS/SYNC_CLEAR_RANGE/SHEET_LAST_COLUMN を
        # 変更しているのに最新 commit メッセージに [sheet-schema] タグがない場合は fail。
        # PR では HEAD のメッセージを、push では event の commits を見る。
        run: |
          set +e
          # PR の場合は base..HEAD、push の場合は最新 commit を対象
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            DIFF_RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            DIFF_RANGE="HEAD~1..HEAD"
          fi
          CHANGED=$(git diff --name-only "$DIFF_RANGE" 2>/dev/null || true)
          SCHEMA_FILES="functions/src/lib/sheets.ts functions/src/services/sheetsSync.ts functions/src/index.ts functions/src/constants.ts"
          HIT=0
          for f in $SCHEMA_FILES; do
            if echo "$CHANGED" | grep -qE "(^|/)$(basename $f)\$"; then
              if git diff "$DIFF_RANGE" -- "$f" 2>/dev/null | grep -qE "^[+-].*(SHEET_HEADERS|SYNC_CLEAR_RANGE|SHEET_LAST_COLUMN)"; then
                HIT=1
                break
              fi
            fi
          done
          if [ "$HIT" -eq 1 ]; then
            LAST_MSG=$(git log -1 --pretty=%B)
            if ! echo "$LAST_MSG" | grep -q "\[sheet-schema\]"; then
              echo "❌ SHEET_HEADERS/SYNC_CLEAR_RANGE/SHEET_LAST_COLUMN を変更しているのに commit message に [sheet-schema] タグがありません"
              echo "   詳細: 00_projects/futami_reservation/CLAUDE.md ★5 ルール"
              exit 1
            fi
            echo "✅ [sheet-schema] タグ確認OK"
          else
            echo "✅ SHEET_HEADERS 変更なし"
          fi
